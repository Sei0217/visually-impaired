        <!-- Language switcher -->

          <select id="langSelect" aria-label="Language">

  <main>
    <div class="map-wrap">
      <div class="map-head">
        <h2 data-i18n="map_title"><i class="fas fa-location-arrow"></i> Your Location Map</h2>
      </div>
      <div id="mapStatus" data-i18n="map_status_ask">Asking for your location…</div>
      <p class="status">Lat/Lon: <span id="gmCoords">--</span></p>
      <button id="enableLocationBtn" type="button" data-i18n="enable_location">Enable location</button>
      <iframe id="gmIframe" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </main>

  
<script>
//Location


function setStatus(msg) {
  const el = document.getElementById('mapStatus');
  if (el) el.textContent = msg || '';
}
function setCoords(lat, lon) {
  const el = document.getElementById('gmCoords');
  if (el) el.textContent = `${lat}, ${lon}`;
}
function mapsLangParam() {
  const sel = document.getElementById('langSelect');
  const v = (sel && sel.value) ? sel.value : 'en';
  return (v === 'tl') ? 'fil' : 'en';
}
function embedMap(lat, lon) {
  const iframe = document.getElementById('gmIframe');
  const hl = mapsLangParam();
  iframe.src = `https://www.google.com/maps?q=${lat},${lon}&z=16&hl=${hl}&output=embed&t=${Date.now()}`;
  iframe.style.display = 'block';
  setStatus('Showing your current location.');
}

// Read coordinates from URL and show map
function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const lat = params.get("lat");
  const lon = params.get("lon");

  if (lat && lon) {
    setCoords(lat, lon);
    embedMap(lat, lon);
  } else {
    setStatus("No coordinates passed. Please allow location on the Home page first.");
  }
}

window.addEventListener('DOMContentLoaded', loadFromURL);

// Update map when language changes
document.getElementById('langSelect')?.addEventListener('change', () => {
  const params = new URLSearchParams(window.location.search);
  const lat = params.get("lat");
  const lon = params.get("lon");
  if (lat && lon) embedMap(lat, lon);
});

// === Helpers ===
function detectDefaultLang() {
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('fil') || nav.startsWith('tl')) return 'tl';
  if (nav.startsWith('ceb') || nav.startsWith('cb')) return 'ceb';
  return 'en';
}
function currentLang() {
  return localStorage.getItem('app.lang') || detectDefaultLang();
}
function t(key, lang) {
  const L = lang || currentLang();
  return (I18N[L] && I18N[L][key]) || (I18N.en[key] || key);
}
function applyI18N(lang) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (key && t(key, lang)) el.textContent = t(key, lang);
  });

  // Detect which meta title to use based on current page
  const path = location.pathname.toLowerCase();
  if (path.includes('information')) document.title = t('meta_info', lang);
  else if (path.includes('loc')) document.title = t('meta_loc', lang);
  else document.title = t('meta_home', lang);
}
function setLang(lang) {
  if (!I18N[lang]) lang = 'en';
  localStorage.setItem('app.lang', lang);
  const select = document.getElementById('langSelect');
  if (select) select.value = lang;
  applyI18N(lang);
}

// === Initialize ===
document.addEventListener('DOMContentLoaded', () => {
  const lang = currentLang();
  setLang(lang);

  const select = document.getElementById('langSelect');
  if (select) select.addEventListener('change', e => setLang(e.target.value));
});
